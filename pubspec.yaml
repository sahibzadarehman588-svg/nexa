
name: nexia
description: "NEXIA - Next-Generation Intelligent Assistant. One App. One Intelligent Assistant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  get: ^4.6.6

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10

  # UI/UX
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4

  # Camera & Image Processing
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.11.0
  mobile_scanner: ^5.0.0

  # Notifications & Permissions
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.2.0

  # Utilities
  intl: ^0.19.0
  image: ^4.1.7
  path_provider: ^2.1.2
  timezone: ^0.9.4
  uuid: ^4.0.0
  shared_preferences: ^2.2.0

  # AI Services
  http: ^1.2.0
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.0
  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/nexia_icon.png.jpeg"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/nexia_icon.png.jpeg"
